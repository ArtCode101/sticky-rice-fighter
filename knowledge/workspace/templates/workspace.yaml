# Workspace manifest.
#
# Lists every repository that belongs to this workspace, its type, and the phase
# in which it is created. The Workspace Init Agent reads this file and creates
# the repositories in phase order.
#
# This file lives in the workspace (at WORKSPACE_PATH), not in the framework
# repository, because it grows as new repositories are identified.

workspace:
  name: my-workspace

  # Git layout. Asked of the human at initialization, every time, and never changed
  # afterwards. "mono" = one git repository at the workspace root holding every
  # repository below as a directory. "multi" = one git repository per entry.
  # When the human does not choose, the answer is "mono".
  repo_layout: mono

  # Whether the human asked for an MCP server over this system's backend API.
  # Asked at initialization, every time. When the human does not answer, or says no,
  # this stays false and nothing MCP-related is generated.
  mcp_server: false

  # Whether agents may take the option they recommend without stopping to ask.
  # Asked at initialization, every time. When the human does not answer, this stays
  # false and every question is asked. A question with no recommended option is
  # asked even when this is true. See knowledge/questions/AGENTS.md.
  auto_recommend: false

repos:
  # --- Phase 1: no dependencies, created immediately -----------------------
  - name: my-workspace-registry
    type: registry
    phase: 1
    remote: null

  - name: my-workspace-requirement
    type: requirement
    phase: 1
    remote: null

  # Created empty. Deploy scripts are added later.
  - name: my-workspace-deployment
    type: deployment
    phase: 1
    remote: null

  # Created empty. Configuration is added later.
  - name: my-workspace-config
    type: config
    phase: 1
    remote: null

  # --- Phase 2: appended by the Requirement Analysis Agent ----------------
  # Backend repositories are split by domain.
  # Frontend repositories are split by user group, for example a separate admin
  # portal and general-user site. Mobile repositories are split the same way.
  # The journey repository holds every journey, its mock data and its test script.
  # Batch jobs and listeners get one repository each, never a shared one.
  # The tool repository holds the Python datastore access tools, at most one.
  # The mcp-server repository is created only if the human asked for one, at most one.
  #
  # - name: my-workspace-backend-<domain>
  #   type: backend
  #   phase: 2
  #   remote: null
  #
  # - name: my-workspace-frontend-<user-group>
  #   type: frontend
  #   phase: 2
  #   remote: null
  #
  # - name: my-workspace-mobile-<user-group>
  #   type: mobile
  #   phase: 2
  #   remote: null
  #
  # - name: my-workspace-journey
  #   type: journey
  #   phase: 2
  #   remote: null
  #
  # - name: my-workspace-batch-<job>
  #   type: batch
  #   phase: 2
  #   remote: null
  #
  # - name: my-workspace-listener-<topic>
  #   type: listener
  #   phase: 2
  #   remote: null
  #
  # - name: my-workspace-tool
  #   type: tool
  #   phase: 2
  #   remote: null
  #
  # Only when workspace.mcp_server is true. At most one, whatever the number of
  # backend domains.
  #
  # - name: my-workspace-mcp-server
  #   type: mcp-server
  #   phase: 2
  #   remote: null
