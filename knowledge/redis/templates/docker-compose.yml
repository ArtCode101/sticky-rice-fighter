services:
  redis:
    image: redis:8.2
    container_name: ${REDIS_CONTAINER_NAME:-art-redis}

    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-artpassword}"]

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD:-artpassword} ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  redis_data:
