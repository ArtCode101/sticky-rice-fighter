# Serves the static export inside the frontend container.
#
# This is not the gateway. It knows nothing about the backends: the gateway sends it
# only what is not an API call. See knowledge/nginx/AGENTS.md.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The gateway stands in front of this container, so a redirect built from this
    # server's own host and port would point the browser at an address it cannot reach.
    absolute_redirect off;

    # Next.js writes /accounts as accounts.html, and links without a trailing slash.
    location / {
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # File names under _next/static carry a content hash, so they never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
