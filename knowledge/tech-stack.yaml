frontend:
  runtime:
    name: Node.js
    version: "24"
  framework:
    name: Next.js
    version: "16"
  libraries:
    - name: "@mui/material"
      version: "9.4.0"
    - name: "@mui/icons-material"
      version: "9.4.0"
    - name: "tailwindcss"
      version: "4.3.3"
    - name: "@tanstack/react-query"
      version: "5.104.0"
    - name: "zustand"
      version: "5.0.15"
    - name: "react-hook-form"
      version: "7.89.0"
    - name: "zod"
      version: "4.6.5"
    - name: "axios"
      version: "1.20.0"
    - name: "date-fns"
      version: "4.4.0"
    - name: "lucide-react"
      version: "1.48.0"
    - name: "recharts"
      version: "3.10.1"
    - name: "three"
      version: "0.186.0"
    - name: "@react-three/fiber"
      version: "9.8.1"
    - name: "socket.io-client"
      version: "4.8.4"

backend:
  language:
    name: Java
    version: "25"
  framework:
    name: Spring Boot
    version: "4.1.x"
  dependencies:
    - name: "spring-boot-starter-webmvc"
      version: "4.1.1"
    # Generates the OpenAPI document every backend commits to the registry, which
    # is the only input the MCP server is built from. See knowledge/mcp/AGENTS.md.
    #
    # Verified 2026-10-02 against Maven Central: the 3.1.x line is built on Spring
    # Boot 4.1.0 (2.8.x / 2.9.x target Spring Boot 3 and must not be used). A test
    # build on Java 25 + Spring Boot 4.1.1 served /v3/api-docs as OpenAPI 3.1.0.
    - name: "springdoc-openapi-starter-webmvc-api"
      version: "3.1.1"
    - name: "spring-boot-starter-validation"
      version: "4.1.1"
    - name: "spring-boot-starter-data-jpa"
      version: "4.1.1"
    - name: "postgresql"
      version: "42.7.10"
    - name: "spring-boot-starter-flyway"
      version: "4.1.1"
    - name: "spring-boot-starter-kafka"
      version: "4.1.1"
    - name: "spring-kafka"
      version: "4.1.1"
    - name: "spring-boot-starter-data-redis"
      version: "4.1.1"
    - name: "spring-boot-starter-cache"
      version: "4.1.1"
    - name: "spring-boot-starter-security"
      version: "4.1.1"
    - name: "spring-boot-starter-oauth2-resource-server"
      version: "4.1.1"
    - name: "spring-security-oauth2-jose"
      version: "7.0.9"
    - name: "nimbus-jose-jwt"
      version: "10.8"
    - name: "spring-boot-starter-restclient"
      version: "4.1.1"
    - name: "spring-boot-starter-jackson"
      version: "4.1.1"
    - name: "jackson-dataformat-xml"
      version: "2.21.5"
    - name: "spring-boot-starter-integration"
      version: "4.1.1"
    - name: "spring-integration-sftp"
      version: "7.0.6"
    - name: "commons-io"
      version: "2.20.0"
    - name: "commons-lang3"
      version: "3.18.0"
    - name: "lombok"
      version: "1.18.42"
    - name: "spring-boot-starter-actuator"
      version: "4.1.1"
    - name: "micrometer-registry-prometheus"
      version: "1.16.9"
    - name: "spring-boot-starter-test"
      version: "4.1.1"
    - name: "testcontainers-postgresql"
      version: "2.0.3"
    - name: "testcontainers-kafka"
      version: "2.0.3"

database:
  - name: PostgreSQL
    version: "16"

messaging:
  - name: Kafka
    version: "4"

testing:
  language:
    name: Python
    version: "3.13"  # fixed version, used for Playwright
  tools:
    - name: Playwright
      version: "1.63.0"
internal:
  language:
    name: Python
    version: "3.13"  # fixed version, Internal tooling
  tools:
    - name: psycopg
      version: "3.2.4"
    - name: confluent-kafka
      version: "2.6.1"
    - name: redis
      version: "5.2.1"
    - name: httpx
      version: "0.28.1"

gateway:
  # The frontend calls the backend through Nginx only.
  # Host process during development, Docker container at deploy time.
  - name: Nginx
    version: "1.30.5"

mcp:
  # The MCP server wraps the system this framework built, so an outside AI agent can
  # drive it. Both sides are locked; only the server is ever generated.
  #
  # Flow, which never bends:
  #   AI Agent -> MCP Client -> MCP Server -> Nginx -> Backend API -> Database
  #
  # Verified 2026-10-01 against the npm registry.
  runtime:
    name: Node.js
    version: "24"                 # the same runtime the frontend uses
  language:
    name: TypeScript
    version: "7.0.2"
  sdk:
    # MCP SDK v2 splits server and client into separate packages. The combined
    # "@modelcontextprotocol/sdk" package stopped at 1.x and is not used here.
    - name: "@modelcontextprotocol/server"
      version: "2.2.0"
    - name: "@modelcontextprotocol/client"
      version: "2.2.0"            # locked for reference only; never generated
  libraries:
    - name: "zod"
      version: "4.6.5"            # same pin as the frontend; the SDK needs zod ^4.2.0
    - name: "@types/node"
      version: "26.6.3"           # TypeScript 7 needs types: ["node"] in tsconfig.json
  testing:
    - name: "vitest"
      version: "5.0.3"
  build:
    - name: npm
      version: null               # the npm bundled with the pinned Node.js
    - name: tsc
      version: "7.0.2"            # the TypeScript compiler pinned above
  image:
    name: node
    tag: "24.21.0-alpine3.24"     # never the latest tag
  transport:
    local: stdio
    remote: streamable-http
  auth:
    remote: oauth-2.1
    # The MCP server holds no signing key. It exchanges the caller's token for a
    # JWT RS256 at the backend, which already owns the key pair.
    backend: jwt-rs256-via-token-exchange
  http_client: node-builtin-fetch
  # Deliberately NOT locked, because they are deliberately not used:
  #   Express, NestJS or any other HTTP framework - the SDK carries its own transport
  #   any database driver or ORM - the MCP server never touches a datastore

tools:
  - name: Docker
    version: null
