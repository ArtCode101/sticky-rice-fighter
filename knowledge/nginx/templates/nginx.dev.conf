# Nginx configuration for the development phase.
#
# Nginx runs as a HOST PROCESS here, not as a container, alongside the host-run
# backends and frontend. Upstreams therefore point at 127.0.0.1.
#
# Every caller reaches the backend through this gateway only: the frontend, the MCP
# server, and anything added later. None of them may call a backend port directly.
#
# Start it with:
#   nginx -p ${WORKSPACE_PATH}/local-env/nginx -c nginx.conf
# Reload after editing:
#   nginx -p ${WORKSPACE_PATH}/local-env/nginx -c nginx.conf -s reload
# Stop:
#   nginx -p ${WORKSPACE_PATH}/local-env/nginx -c nginx.conf -s stop

worker_processes 1;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log logs/access.log;

    # One upstream per backend repository. Ports come from the workspace's
    # config repository. Add a block here when a backend repository is added.
    upstream backend_example_domain {
        server 127.0.0.1:8080;
    }

    # upstream backend_other_domain {
    #     server 127.0.0.1:8081;
    # }

    # The backend that owns authentication, and therefore the token exchange the MCP
    # server calls. Point this at whichever backend repository holds it.
    upstream backend_auth {
        server 127.0.0.1:8080;
    }

    server {
        # The single address the frontend talks to.
        listen 8000;
        server_name localhost;

        # One location per backend. Keep the path prefix aligned with the domain
        # the backend owns.
        location /api/example/ {
            proxy_pass http://backend_example_domain/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass the Authorization header through so the backend can verify the
            # RS256 JWT itself.
            proxy_set_header Authorization $http_authorization;
        }

        # The token exchange endpoint. The MCP server calls it to turn a caller's
        # token into a JWT RS256 for that same user, because the backend owns the
        # authentication group's key pair and the MCP server holds no key.
        #
        # It is a backend endpoint, so it is routed here like any other.
        location /api/auth/ {
            proxy_pass http://backend_auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # location /api/other/ {
        #     proxy_pass http://backend_other_domain/;
        # }

        # Anything that is not an API call goes to the frontend dev server.
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
