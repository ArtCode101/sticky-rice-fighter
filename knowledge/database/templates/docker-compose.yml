services:
  postgres:
    image: postgres:16.15
    container_name: ${POSTGRES_CONTAINER_NAME:-art-postgres}

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artdb}
      POSTGRES_USER: ${POSTGRES_USER:-artuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artpassword}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-artuser} -d ${POSTGRES_DB:-artdb}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data: